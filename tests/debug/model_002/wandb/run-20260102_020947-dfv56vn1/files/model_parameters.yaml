element_pool:
- (X)
- Au
- Cu
- Pd
- Rh
- Ni
- Ga
random_seed: 42
drop_prob: 0.1
lr: 0.0001
weight_decay: 0.0001
use_x0_reparam: true
auxillary_weight: 0.001
min_loss_weight: 0.001
scheduler_info:
  t_init: 1
  t_final: 1000
  beta_max: 0.1
  beta_min: 0.0001
  scheduler_type: ExponentialScheduler
denoiser_info:
  condition_info:
    embedding_dim: 128
    num_labels: 3
    embedding_type: ClassLabelEmbedder
  denoiser_type: DiscreteGNNDenoiser
  message_dim: 128
  mark_active_sites: true
  use_edge_attr: true
  n_hidden_layers: 3
  hidden_dim_rep: 128
  time_embedding_dim: 128
  aggr: mean
noiser_info:
  noiser_type: AbsorbingStateNoiser
