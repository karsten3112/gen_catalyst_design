element_pool:
- (X)
- Au
- Cu
- Pd
- Rh
- Ni
- Ga
random_seed: 42
drop_prob: 0.1
lr: 0.0001
weight_decay: 0.0001
use_x0_reparam: false
auxillary_weight: 0.0
scheduler_info:
  t_init: 1
  t_final: 1000
  beta_max: 0.1
  beta_min: 0.001
  scheduler_type: LinearScheduler
denoiser_info:
  condition_info:
    embedding_dim: 64
    num_labels: 3
    embedding_type: ClassLabelEmbedder
  denoiser_type: DiscreteGNNDenoiser
  message_dim: 64
  mark_active_sites: false
  use_edge_attr: false
  n_hidden_layers: 4
  hidden_dim_rep: 64
noiser_info:
  noiser_type: AbsorbingStateNoiser
